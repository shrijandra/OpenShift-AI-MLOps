apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-model-deployer
  namespace: fraud-mlops

rules:

  - apiGroups:
      - serving.kserve.io
    resources:
      - inferenceservices
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: tekton-model-deployer
  namespace: fraud-mlops

subjects:

  - kind: ServiceAccount
    name: pipeline
    namespace: fraud-mlops

roleRef:

  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-model-deployer
